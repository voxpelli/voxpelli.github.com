name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Deploy-capable permissions (pages/id-token) are scoped to the deploy job
# only — the build and e2e jobs run branch code on pull_request triggers and
# must not hold them.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, e2e]
    steps:
      # configure-pages lives HERE, not in build: the Pages API calls it makes
      # need Pages permissions the PR-triggered build job must not hold, its
      # outputs are unused by the build, and failing on a misconfigured Pages
      # setup belongs at deploy time — the only moment it matters.
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # The custom domain lives in Settings → Pages (no CNAME file with
      # artifact deploys) — out-of-repo state nothing else verifies. If a
      # settings change ever drops it, page_url regresses to *.github.io and
      # every canonical URL, feed id and webmention breaks. Fail loudly.
      - name: Verify the custom domain survived the deploy
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$PAGE_URL" in
            https://voxpelli.com|https://voxpelli.com/*)
              echo "custom domain intact: $PAGE_URL" ;;
            *)
              echo "::error::Pages deployed to $PAGE_URL — the custom domain is gone (Settings → Pages → Custom domain)"
              exit 1 ;;
          esac
